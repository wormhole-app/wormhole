name: CD

on:
  push:
    tags:
      - '**'

jobs:
  release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release: true

  create-release:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: ./artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos
          path: ./artifacts/macos

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ./artifacts/android

      - name: Download Linux DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: ./artifacts/linux

      - name: Download Linux RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-rpm
          path: ./artifacts/linux

      - name: Rename release assets
        run: |
          VERSION=${GITHUB_REF_NAME}
          VERSION=${VERSION//\//-}
          mkdir -p ./release-assets

          cp ./artifacts/android/app-release.apk "./release-assets/wormhole-${VERSION}-android-play.apk"
          cp ./artifacts/android/wormhole-android-openSource-armeabi-v7a.apk "./release-assets/wormhole-${VERSION}-android-fdroid-armeabi-v7a.apk"
          cp ./artifacts/android/wormhole-android-openSource-arm64-v8a.apk "./release-assets/wormhole-${VERSION}-android-fdroid-arm64-v8a.apk"
          cp ./artifacts/android/wormhole-android-openSource-x86_64.apk "./release-assets/wormhole-${VERSION}-android-fdroid-x86_64.apk"
          cp ./artifacts/windows/wormhole.zip "./release-assets/wormhole-${VERSION}-windows-x64.zip"
          cp ./artifacts/macos/wormhole.dmg "./release-assets/wormhole-${VERSION}-macos.dmg"

      - name: Extract changelog for current version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk "/## ${VERSION}\$/{flag=1; next} /## [0-9]/{flag=0} flag" CHANGELOG.md)

          # If changelog is empty, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${VERSION}"
          fi

          # Save to output (escape for GitHub Actions)
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: |
            ./release-assets/*.apk
            ./release-assets/*.zip
            ./release-assets/*.dmg
            ./artifacts/linux/*.deb
            ./artifacts/linux/*.rpm
